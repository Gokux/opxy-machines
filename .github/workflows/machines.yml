name: Machine checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # SDK 1.3 (OP-XY OS 1.2.1): update deliberately when adopting another SDK revision.
  OPEN_XY_REF: b061cfe8bdd82b8c01082cade3ee0377d8e0e736

jobs:
  machines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machines
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Validate, build previews and run machine tests
        shell: python
        run: |
          import re
          import subprocess
          import sys
          command = [sys.executable, 'open-xy/sdk.py', 'test', '--cxx', 'clang++', '--host-cxx', 'g++']
          for machine in ('drone', 'solar', 'papasrapa'):
              command += ['--machine', 'machines/' + machine]
          result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout, flush=True)
          if result.returncode:
              raise SystemExit(result.returncode)
          estimates = dict(re.findall(r'CPU estimate .*?: (.*?) about ([\d,]+) Blackfin instructions', result.stdout))
          if set(estimates) != {'Drone', 'Solar', 'Papa Srapa'}:
              raise SystemExit('Missing CPU estimates')
          for machine, estimate in estimates.items():
              if int(estimate.replace(',', '')) >= 20000:
                  raise SystemExit(machine + ': CPU estimate must stay below 20,000')
      - name: Sound arithmetic sanitization
        shell: bash
        run: |
          for machine in drone solar papasrapa; do
            clang++ -std=c++11 -O1 -g -fsanitize=undefined -fno-sanitize-recover=all -I open-xy/sdk/include "machines/$machine/tests/sound.cpp" -o "$RUNNER_TEMP/$machine-sound"
            "$RUNNER_TEMP/$machine-sound"
          done

  firmware:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machines
      - uses: actions/checkout@v4
        with:
          repository: etcetc000/open-xy
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Blackfin tools
        run: python open-xy/sdk.py toolchain fetch
      - name: Compile with the bundled machines
        run: python open-xy/sdk.py compile --machine machines/drone --machine machines/solar --machine machines/papasrapa --out "$env:RUNNER_TEMP/module"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser linker compatibility
        run: |
          node --input-type=module -e "
          import {readObject} from './open-xy/builder/core.mjs';
          import {readdirSync, readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const root = join(process.env.RUNNER_TEMP, 'module');
          const names = readdirSync(root, {recursive: true}).filter(name => name.endsWith('.o'));
          if (!names.length) throw new Error('No native objects');
          for (const name of names) readObject(readFileSync(join(root, name)));
          console.log('PASS: browser linker accepts ' + names.length + ' native objects');
          "
